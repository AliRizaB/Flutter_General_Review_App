name: flutter_general_reviewer
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.11.1
  dotted_border: ^3.1.0
  flex_color_picker: ^3.8.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_rating_bar: ^4.0.1
  flutter_typeahead: ^6.0.0
  get: ^4.7.3
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/noImage.jpg
  fonts:
    - family: Isometra
      fonts:
        - asset: assets/fonts/Isometra-Regular.ttf
