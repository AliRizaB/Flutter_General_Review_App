  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Isometra
      fonts:
        - asset: assets/fonts/Isometra-Regular.ttf 
