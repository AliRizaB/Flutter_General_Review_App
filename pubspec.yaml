name: flutter_general_reviewer
description: "Reviewer Application"
publish_to: "none"
version: 0.1.0+2

environment:
  sdk: ^3.11.1

dependencies:
  # Essentials
  flutter:
    sdk: flutter
  get: ^4.7.3
  flutter_localizations:
    sdk: flutter

  # Services
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2+1

  # Helper
  flutter_typeahead: ^6.0.0
  flex_color_picker: ^3.8.0
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.2.5

  # Customization
  dotted_border: ^3.1.0
  flex_color_scheme: ^8.4.0
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/noImage.jpg # No image
  fonts:
    - family: Isometra
      fonts:
        - asset: assets/fonts/Isometra-Regular.ttf
