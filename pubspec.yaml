publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.11.1
  flex_color_picker: ^3.8.0
  flutter:
    sdk: flutter
  get: ^4.7.3
  image_picker: ^1.2.3
